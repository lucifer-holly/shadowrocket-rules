# 示例配置；优先用模块保留原 default.conf。
# 不含节点；PROXY 使用 Shadowrocket 选择的节点；SSH 规则需自行添加。
[General]
bypass-system = true

[Rule]
IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
RULE-SET,https://raw.githubusercontent.com/lucifer-holly/shadowrocket-rules/main/dist/rules/base.list,REJECT
GEOIP,CN,DIRECT
FINAL,PROXY
