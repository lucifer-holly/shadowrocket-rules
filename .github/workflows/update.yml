name: Upstream auto update
on:
  schedule:
    - cron: '17 4 * * *' # 12:17 Asia/Shanghai, best effort
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: upstream-update
  cancel-in-progress: false
jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ALERT_TITLE: 上游自动更新需要关注
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: true
      - name: Refresh data-only sources, run every check, publish to main
        id: publish
        shell: bash
        run: |
          set -euo pipefail
          # Commit as the repository owner (GitHub noreply address) so the contributor list stays the owner alone.
          git config user.name '${{ github.repository_owner }}'
          git config user.email '${{ github.repository_owner_id }}+${{ github.repository_owner }}@users.noreply.github.com'
          for attempt in 1 2 3; do
            python3 tools/validate.py
            # Exit 3: some sources were blocked and kept their old snapshots; the healthy ones are still published.
            upstream_rc=0
            python3 tools/upstream.py || upstream_rc=$?
            if [ "$upstream_rc" != 0 ] && [ "$upstream_rc" != 3 ]; then exit "$upstream_rc"; fi
            echo "upstream_rc=${upstream_rc}" >> "$GITHUB_OUTPUT"
            python3 tools/build.py
            python3 tools/validate.py
            python3 -m unittest discover -s tests
            node --test tests/*.test.cjs
            if git diff --quiet -- vendor sources/upstreams.lock.json dist reports; then
              echo 'No rule changes.' >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            git add vendor sources/upstreams.lock.json dist reports
            git commit -q -m 'chore: automatic upstream rule refresh'
            if git push origin HEAD:main; then
              echo 'Checked update published to main.' >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            # main moved during the run: start again from the newest main instead of overwriting it.
            git fetch -q origin main
            git reset -q --hard origin/main
          done
          echo 'main kept changing during three attempts; nothing was published.'
          exit 1
      - name: Publish availability and change report
        if: always()
        run: |
          if [ -f .cache/update.md ]; then cat .cache/update.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Open or update the alert issue
        if: failure() || steps.publish.outputs.upstream_rc == '3'
        shell: bash
        run: |
          set -euo pipefail
          body=$(mktemp)
          {
            echo "运行记录：${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            echo '已通过检查的来源照常发布；被拦截的来源继续使用旧快照，设备上的规则不会因此失效。'
            echo
            if [ -f .cache/update.md ]; then cat .cache/update.md; else echo '没有生成上游报告，请查看运行记录。'; fi
          } > "$body"
          number=$(gh issue list --state open --json number,title --jq "map(select(.title == \"${ALERT_TITLE}\")) | .[0].number // empty")
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file "$body"
          else
            gh issue create --title "$ALERT_TITLE" --body-file "$body"
          fi
      - name: Close the alert issue after a fully healthy run
        if: success() && steps.publish.outputs.upstream_rc == '0'
        shell: bash
        run: |
          set -euo pipefail
          number=$(gh issue list --state open --json number,title --jq "map(select(.title == \"${ALERT_TITLE}\")) | .[0].number // empty")
          if [ -n "$number" ]; then
            gh issue close "$number" --comment "已恢复：${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID} 全部来源通过检查。"
          fi
      - name: Ask for review when a pinned third-party script has a new version
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          [ -f .cache/update.json ] || exit 0
          reviews=$(python3 -c "import json; print(' '.join(json.load(open('.cache/update.json')).get('reviews', [])))")
          [ -n "$reviews" ] || exit 0
          title='第三方脚本有新版本，需要审核'
          body="上游有新版本：${reviews}。脚本会接触解密后的请求，所以不会自动更新；当前固定版本继续使用。审核后更新 sources/scripts.lock.json 与 vendor/ 中的副本。运行记录：${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          number=$(gh issue list --state open --json number,title --jq "map(select(.title == \"${title}\")) | .[0].number // empty")
          if [ -z "$number" ]; then gh issue create --title "$title" --body "$body"; fi
      - name: Mark the run as needing attention when a source was blocked
        if: steps.publish.outputs.upstream_rc == '3'
        run: |
          echo 'Some upstream sources were blocked by safety checks; healthy sources were published.'
          exit 1
      - name: Retain the diagnostic report even on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: upstream-report-${{ github.run_id }}
          path: |
            .cache/update.md
            .cache/update.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
